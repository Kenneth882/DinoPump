name: dinopump-integration
services:
  postgres-test:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: dinopump_test
      POSTGRES_PASSWORD: synthetic_test_only
      POSTGRES_DB: dinopump_test
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dinopump_test -d dinopump_test"]
      interval: 2s
      timeout: 5s
      retries: 20
